<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:0.2" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Section 1: Perception & Observation -->
  <g transform="translate(30, 40)">
    <rect width="210" height="240" rx="12" fill="url(#grad1)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="105" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">1. State Estimation</text>
    
    <!-- Observation box -->
    <rect x="20" y="55" width="170" height="45" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="77" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Proprioception</text>
    <text x="105" y="92" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">q, dq, IMU, contact states</text>

    <!-- Exteroception box -->
    <rect x="20" y="115" width="170" height="45" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="137" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Elevation Map</text>
    <text x="105" y="152" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Height scan / LiDAR / Depth</text>

    <!-- Commands box -->
    <rect x="20" y="175" width="170" height="45" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="197" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Velocity Command</text>
    <text x="105" y="212" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">[v_x, v_y, omega_yaw]</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="160" x2="305" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 2: Policy & High-level Control -->
  <g transform="translate(315, 40)">
    <rect width="250" height="240" rx="12" fill="url(#grad2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="125" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">2. RL Locomotion Policy</text>

    <!-- MLP / Transformer Card -->
    <rect x="20" y="55" width="210" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Actor-Critic Network</text>
    <text x="125" y="98" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="middle">Temporal History Encoder (TCN / GRU)</text>
    <text x="125" y="122" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Privileged Teacher Distillation</text>

    <!-- Target Output -->
    <rect x="20" y="155" width="210" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="180" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Joint Target Generator</text>
    <text x="125" y="200" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Target Position / Nominal Trajectory q_d</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="570" y1="160" x2="630" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 3: Low-Level Controller & Actuation -->
  <g transform="translate(640, 40)">
    <rect width="230" height="240" rx="12" fill="url(#grad3)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="115" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">3. Actuation &amp; Hardware</text>

    <!-- PD Controller -->
    <rect x="20" y="55" width="190" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="80" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Low-Level PD Controller</text>
    <text x="115" y="100" font-family="sans-serif" font-size="10" fill="#b45309" text-anchor="middle">tau = Kp(q_d - q) - Kd(dq)</text>

    <!-- Hardware / Sim Target -->
    <rect x="20" y="140" width="190" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="165" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Execution Platform</text>
    <text x="115" y="185" font-family="sans-serif" font-size="11" fill="#10b981" text-anchor="middle">&#x2714; Isaac Gym / MuJoCo</text>
    <text x="115" y="205" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">&#x2714; Real Quadruped / Biped</text>
  </g>
</svg>
